spring:
  application:
    name: warehouse-inventory

  datasource:
    url: jdbc:mysql://localhost:3307/warehouse_db
    username: root
    password: secret
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: VARCHAR
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:placeholder@example.com}
    password: ${MAIL_PASSWORD:placeholder}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

notification:
  max-retries: 3
  breach-limit: 2

scheduler:
  retry-interval-ms: 300000
  retry-initial-delay-ms: 60000
  expiry-interval-ms: 300000
  expiry-initial-delay-ms: 30000